# ============================================================
# EarthSim global configuration
# All physical, numerical, precompute, and server parameters live here.
# ============================================================

backend: cuda            # auto | cuda | cpu

grid:
  nlat: 360              # 90 (2 deg), 180 (1 deg), 360 (0.5 deg)
  nlon: 720           # usually nlat*2
  topo_file: data/etopo2022_60s.npz
  topo_files:
    - data/etopo2022_60s.npz
    - data/etopo20.npz

time:
  dt: 30
  start: "2026-05-01T00:00:00"
  spinup_days: 0

data:
  # Initial state: ideal | auto | real
  # auto uses the real-data files when available and falls back to the
  # idealized state otherwise. An empty init_time uses time.start above.
  init_mode: real  
  atmosphere_file: data/era5_pressure_levels.nc
  surface_file: data/era5_single_levels.nc
  ocean_file: data/cmems_surface_currents.nc
  init_time: ""

physics:
  # Feature switches
  moisture: true
  radiation: true
  ocean: true
  ice_albedo: true
  sea_ice:
    enabled: true
    freezing_temp_k: 271.2
    density_kg_m3: 917.0
    conductivity_w_m_k: 2.1
    latent_heat_j_kg: 334000.0
    full_cover_mass_kg_m2: 100.0  # Reference mass for complete coverage
  diurnal_cycle: true

  # Active atmospheric dynamics
  dynamics:
    core: primitive_equations       # primitive_equations | shallow_water
    # Fixed-pressure model top. 3 hPa matches the CAM4 26-level grid; the
    # hybrid coordinate below becomes pure pressure above 100 hPa.
    top_pressure_pa: 300.0
    reference_surface_pressure_pa: 101300.0
    # The smoothed terrain stays below ~5.5 km (~50 kPa); this bound only
    # guards the hybrid layers against collapsing and should never trigger.
    min_surface_pressure_pa: 45000.0
    max_surface_pressure_pa: 120000.0
    surface_pressure_diffusivity: 0.0
    # Second-order divergence damping (fraction of the explicit limit).
    divergence_damping_coeff: 0.05
    # Global total-energy fixer and local frictional heating.
    energy_fixer: true
    frictional_heating: true
    # Upper-level sponge: implicit Rayleigh friction on the eddy wind,
    # stronger horizontal diffusion and divergence damping above 50 hPa.
    upper_damping:
      enabled: true
      sponge_base_pressure_pa: 5000.0
      rayleigh_tau_s: 86400.0
      damp_zonal_mean: false
      diffusion_multiplier: 4.0
      divergence_damping_multiplier: 4.0

  # Core dynamics
  H0: 8000.0
  g_eff: 9.8
  beta_T: 22.0
  tau_h: 43200.0
  # Surface drag: quadratic | linear
  # quadratic: tau = rho * C_D * |V| * V with V the lowest-level wind
  # (~80 m AGL), spread over the boundary layer with an
  # exp(-z / topography.influence_height) profile; mountains multiply it by
  # topography.drag_multiplier. drag_wind_min floors |V| (subgrid gusts).
  # linear: constant damping rates drag_*_atmosphere (1/s).
  surface_drag_form: quadratic
  cd_ocean_atmosphere: 1.0e-3
  cd_land_atmosphere: 4.0e-3
  drag_wind_min: 1.0
  drag_ocean_atmosphere: 4.0e-6   # linear form only
  drag_land_atmosphere: 1.2e-5    # linear form only
  visc: 2.0e+4
  diff_T: 2.0e+4
  diff_q: 1.0e+4
  umax: 150

  # Shortwave and surface albedo
  S0: 1361.0
  # Cloud and surface combine with multiple reflection:
  #   absorbed = (1-c)(1-a_clear) + c (1-a_cloud)(1-a_diffuse)/(1-a_cloud a_diffuse)
  # Clear sky sees the direct-beam albedo (zenith dependent), cloudy sky the
  # diffuse one.
  alb_ocean: 0.07                 # diffuse water; direct beam via Briegleb
  ocean_albedo_zenith: true
  alb_land: 0.22
  alb_ice_cold: 0.75              # snow-covered sea ice, skin < Tf - 1 K
  alb_ice_melt: 0.50              # bare / ponded sea ice at the melting point
  ice_albedo_transition_k: 1.0
  alb_snow: 0.70                  # seasonal land snow
  alb_ice_sheet: 0.80             # Greenland / Antarctica
  alb_cloud: 0.42
  snow_zenith_factor: 0.4         # low-sun brightening of snow/ice (0 = off)
  tau_relax_T: 864000.0

  # Prognostic land snow (SWE in mm = kg/m2): snowfall from the rain/snow
  # split of precipitation, energy-conserving melt at melt_temp_k, cover =
  # SWE / full_cover_mm.
  snow:
    enabled: true
    full_cover_mm: 10.0
    rain_snow_temp_k: 274.15      # 50 % snow; all snow < 0 C, all rain > 2 C
    rain_snow_width_k: 2.0
    melt_temp_k: 273.15
    max_mm: 1000.0                # excess runs off (glacier flow)
    initial_mm: 100.0             # initial SWE where the surface is cold

  # Permanent ice sheets: always snow covered with alb_ice_sheet; the surface
  # is capped at the melting point (glacier melt is not tracked as water).
  ice_sheet:
    enabled: true
    antarctic_lat_max: -60.0
    greenland_lat_min: 59.0
    greenland_lon_min: 286.0      # 74 W
    greenland_lon_max: 349.0      # 11 W
    greenland_min_elevation_m: 500.0

  # Moist convection, clouds, and land water
  rh_crit: 0.85
  tau_cond: 3600.0
  c_evap: 1.2e-3
  convective_rh_drop_max: 0.12
  convective_div_scale: 3.0e-5
  cloud_rh_start: 0.70
  cloud_rh_full: 0.95
  cloud_rh_exponent: 1.6
  tau_cloud_form: 1800.0
  tau_cloud_dissip: 3000.0
  cloud_clear_rh: 0.72
  cloud_dry_clear: 4.0
  cloud_subsidence_clear: 3.0
  cloud_precip_clear: 2
  cloud_precip_scale: 0.5
  init_surface_rh: 0.58
  init_upper_rh: 0.28
  ideal_wave_amp_K: 1.2
  ideal_humidity_wave: 0.10
  land_evap: 0.05
  ground_water_capacity_mm: 1000
  initial_ground_water_mm: 60.0
  ground_evap_exponent: 1.0
  ground_runoff_tau: 864000.0
  ground_runoff_exponent: 2.0
  ground_water_diffusivity: 100   # m^2/s, 陆地储水侧向扩散, 0 关闭
  river_routing: true             # 径流沿地形坡度汇流入海

  # Idealized wind initialization
  ideal_wind_enabled: true
  ideal_trade_wind_ms: 5.0
  ideal_surface_westerly_ms: 4.0
  ideal_jet_ms: 22.0
  ideal_polar_easterly_ms: 2.5
  ideal_jet_lat_deg: 42.0
  ideal_jet_width_deg: 12.0
  ideal_jet_height_m: 9000.0
  ideal_jet_depth_m: 4500.0
  ideal_wind_wave_ms: 1.2
  ideal_wind_shape:
    trade_lat_width_deg: 23.0
    trade_decay_height_m: 3500.0
    surface_westerly_lat_deg: 48.0
    surface_westerly_width_deg: 18.0
    surface_westerly_decay_height_m: 4500.0
    polar_easterly_lat_deg: 72.0
    polar_easterly_width_deg: 11.0
    polar_easterly_decay_height_m: 5500.0
    wave_decay_height_m: 9000.0
    wave_u_fraction: 0.6
    wave_wavenumber: 4.0
    wave_phase: 0.8

  initial_conditions:
    # Primitive ideal initialization uses a flat dynamical lower boundary.
    balanced_perturbation_k: 0.001
    balance_tolerance_ms2: 1.0e-4
    equilibrium_temp_base_k: 308.0
    equilibrium_temp_pole_delta_k: 42.0
    surface_lapse_rate: 0.0065
    humidity_decay_height_m: 4500.0
    temp_wave_lon1: 3.0
    temp_wave_phase1: 0.7
    temp_wave_weight2: 0.5
    temp_wave_lon2: 5.0
    temp_wave_phase2: -1.3
    temp_wave_decay_height_m: 7000.0
    real_default_temp_k: 290.0
    real_default_humidity: 0.01
    real_default_mslp_hpa: 1013.0

  bounds:
    air_temp_min_k: 180.0
    air_temp_max_k: 345.0
    surface_temp_min_k: 180.0
    surface_temp_max_k: 350.0
    ocean_initial_min_temp_k: 271.2



    ocean_freezing_min_temp_k: 271.2
    sea_ice_threshold_k: 271.4
    sea_ice_transition_k: 2.0
    snow_threshold_k: 273.5
    snow_transition_k: 6.0
    humidity_min: 0.0
    humidity_max: 0.05
    cloud_min: 0.0
    cloud_max: 1.0
    precip_max_mmh: 5.0
    ocean_current_max_ms: 2.0
    relative_humidity_max: 1.3

  radiation_transfer:
    albedo_max: 0.90
    surface_sw_fraction: 0.80
    cloud_sw_absorption: 0.30
    air_sw_fraction: 0.18
    surface_emissivity: 0.98
    down_emissivity_base: 0.60
    down_emissivity_humidity: 0.25
    down_emissivity_cloud: 0.15
    down_emissivity_max: 0.98
    olr_factor_base: 0.62
    olr_factor_humidity: 0.20
    olr_factor_cloud: 0.08
    olr_factor_min: 0.28
    olr_factor_max: 0.62
    air_longwave_coupling: 0.85
    seasonal_temp_base_k: 288.0
    seasonal_temp_pole_delta_k: 42.0
    seasonal_temp_amp_k: 8.0

  surface_flux:
    wind_speed_floor_ms: 1.0
    sensible_heat_coeff: 1.2e-3
    humidity_greenhouse_scale: 0.02

  moisture_transport:
    # The ad hoc divergence-proportional drying removes water and latent
    # energy without a heat source. The primitive core resolves subsidence
    # drying through vertical transport, so it is disabled here.
    subsidence_drying_coeff: 0.0
    subsidence_divergence_max: 1.0e-4
    precip_cloud_diagnostic_scale_mmh: 2.0
    cloud_subsidence_scale: 1.5e5
    cloud_subsidence_clear_max: 2.0
    cloud_subsidence_cover_max: 0.45
    relative_humidity_min: 0.0
    effective_rh_max: 1.2

  pressure:
    mslp_reference_hpa: 1013.0
    thickness_per_hpa: 8.5
    hpa_per_thickness_m: 0.1176
    thickness_min_factor: 0.4
    thickness_max_factor: 1.8
    thickness_diffusion_factor: 0.5

  # Ocean mixed layer and transport
  mld: 40.0
  tau_ocean: 8.0e-7
  drag_ocean: 1.5e-6
  visc_ocean: 4.0e+4
  ocean_transport:
    wind_speed_floor_ms: 1.0
    ekman_coriolis_factor: 0.15
    surface_heat_diffusivity: 2.0e3
  ocean_layers:
    enabled: true
    lower_depth_m: 200.0
    deep_initial_offset_k: 1.5
    interlayer_drag: 2.0e-7
    interlayer_heat_exchange: 1.0e-7
    deep_drag: 3.0e-7
    deep_visc: 2.0e+4
    deep_temp_min_k: 271.2

  # Vertical atmospheric grid
  vertical:
    enabled: true
    # hybrid: CAM-like sigma-pressure grid generated from the block below.
    # Interface pressure is A + B*ps; B is 1 at the ground and 0 above
    # transition_pressure_pa, so the upper levels are pure pressure surfaces
    # and the sigma-coordinate pressure-gradient error over high terrain is
    # confined to the lower troposphere. Nominal heights for display and data
    # interpolation are derived from the standard atmosphere.
    coordinate: hybrid
    hybrid:
      levels: 26                      # 26-30 recommended
      transition_pressure_pa: 10000.0 # pure pressure above 100 hPa
      top_layers: 7                   # stretched stratospheric layers
      top_stretch: 5.0                # ln(p) spacing ratio at the top
      surface_layers: 6               # geometrically refined PBL layers
      surface_ratio: 0.7
      sigma_exponent: 1.0
      # Alternatively give explicit CAM-style coefficients (surface -> top,
      # hyai in Pa); the generated grid is used when both lists are empty.
      hyai: []
      hybi: []
    # Used only when coordinate is sigma: nominal heights and nz+1 sigma
    # interfaces ordered surface -> model top.
    levels_m: [100,400,800,1300,2000,3000,4300,5800,7600,9800,12500,16000]
    sigma_interfaces: [1.0,0.975,0.94,0.90,0.85,0.78,0.68,0.56,0.43,0.30,0.19,0.09,0.0]
    lapse_rate: 0.0065
    tropopause_height_m: 11000.0
    stratosphere_lapse_rate: 0.001
    minimum_equilibrium_temp_k: 195.0
    scale_height: 8000.0
    scale_height_min_m: 1000.0
    continuity_relax: 1800.0
    buoyancy_factor: 1.5e-4
    w_damping: 5.0e-4
    w_max: 20
    buoyancy_temp_min_k: 180.0
    lowest_layer_mass_min: 0.02
    diff_momentum: 12.0
    diff_heat: 8.0
    diff_moisture: 5.0

  # Column physics: boundary-layer deposition of surface fluxes, radiative
  # heating distribution, implicit vertical mixing of dry static energy and
  # enthalpy-conserving dry convective adjustment.
  column_physics:
    pbl_depth_pa: 10000.0
    radiative_top_pa: 15000.0
    vertical_diffusion: true
    pbl_diffusivity_m2s: 10.0
    free_diffusivity_m2s: 0.2
    diffusion_depth_pa: 15000.0
    richardson_damping: 10.0
    min_shear_squared_s2: 1.0e-6
    dry_adjustment: true
    dry_adjustment_passes: 2

  # Terrain effects
  topography:
    enabled: true
    smooth_passes: 2
    smooth_center_weight: 0.5
    smooth_neighbor_weight: 0.25
    influence_height: 2500.0
    elevation_scale: 1500.0
    slope_scale: 0.02
    drag_multiplier: 8.0
    blocking_rate: 8.0e-4
    deflection_rate: 3.0e-4
    lift_efficiency: 0.3
    lift_max: 10
    slope_min: 1.0e-6
    turn_speed_threshold: 0.1

  # Interactive editing limits
  edit:
    min_radius_km: 50.0
    air_humidity_max: 0.04
    cyclone_max_wind_ms: 120.0

numerics:
  # Global energy/water budgets (energy_diagnostics) are evaluated every
  # this many steps and on the last step of every step() call.
  diagnostic_interval_steps: 60
  # Second-order finite-volume transport. Limiters: minmod | vanleer | mc.
  advection: muscl_tvd
  advection_limiter: mc
  cos_clamp: 0.1
  # A regular latitude/longitude grid needs zonal filtering where grid cells
  # converge; 88 degrees is unstable for hydrostatic gravity waves.
  polar_filter_lat: 70.0
  polar_filter_passes: 6
  polar_divergence_damping_m2s: 2.0e5

precompute:
  out_dir: output/run2
  days: 10
  save_every_steps: 15
  # 从已保存的帧文件继续演算 (如 output/run1/frames/frame_000479.npz);
  # 留空则按 data.init_mode 初始化。也可用命令行 --init-frame 指定。
  # 帧所在目录的 manifest.json 必须与当前网格/垂直层配置一致。
  init_frame: "output/recordings/frames/frame_000000.npz"

server:
  host: 0.0.0.0
  port: 8000
  steps_per_frame: 1
  max_fps: 60
  vector_stride: 5
  basemap_width: 2160
  record_enabled: false
  record_dir: output/recordings
  record_every_steps: 600
  # 实时模式从已保存的帧开始演算 (如 output/run1/frames/frame_000479.npz);
  # 留空则按 data.init_mode 初始化。也可用 serve --init-frame 指定,
  # 或在网页"初始帧"面板中选择。要求与 precompute.init_frame 相同。
  init_frame: ""

